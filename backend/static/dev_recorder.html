<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>候选人侧 · 按需取证录制器</title>
<style>
  :root { --bg:#faf8f5; --card:#fff; --line:#e6e1d8; --text:#242220;
          --dim:#8a8279; --warm:#c9772f; --ok:#3a7d6a; --bad:#b3453e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:14px 22px; border-bottom:1px solid var(--line);
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  .wrap { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
          gap:16px; padding:16px 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:16px; }
  video { width:100%; border-radius:10px; background:#111; display:block; }
  button { background:#fff; border:1px solid var(--line); color:var(--text);
           padding:8px 15px; border-radius:9px; cursor:pointer; font-size:13px; }
  button:hover { background:#f3efe8; }
  button.primary { background:var(--warm); border-color:var(--warm); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input { padding:7px 11px; border:1px solid var(--line); border-radius:8px;
          font:inherit; width:130px; letter-spacing:2px; text-transform:uppercase; }
  .big { font:600 28px/1 Consolas,monospace; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .log { height:250px; overflow:auto; background:#1a1917; color:#c9c3ba;
         border-radius:10px; padding:10px; font:12px/1.6 Consolas,monospace;
         white-space:pre-wrap; }
  .k { color:var(--dim); font-size:12px; }
  .pill { font-size:11px; padding:2px 9px; border-radius:20px;
          border:1px solid var(--line); }
  .pill.on { background:#e7f3ef; border-color:#c9e2da; color:var(--ok); }
  .pill.rec { background:#fdeee1; border-color:#f0d5bd; color:#9a5a1c; }
  .hint { font-size:12px; color:var(--dim); margin-top:10px; line-height:1.75; }
  code { background:#f2eee7; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>候选人侧 · 按需取证</h1>
  <span class="pill" id="wsState">未连接</span>
  <span class="k">房间号</span>
  <input id="code" placeholder="ABC123" maxlength="6">
  <button class="primary" id="conn">连接</button>
  <button id="cam" disabled>开摄像头</button>
  <button id="demo" disabled>连续切片模式</button>
</header>

<div class="wrap">
  <div class="card">
    <video id="cam-view" autoplay muted playsinline></video>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <span class="big" id="count">--</span>
      <span class="k" id="meta">等待连接</span>
    </div>
    <div class="hint">
      <b>默认不再持续上传。</b>后端只在行为信号报警时才发
      <code>record_request</code>，这时录 <b>后端指定的秒数</b>（默认 20s，
      接口下限 15s）再发上去。<br>
      一段 20 秒视频约消耗 <b>17 万 token</b>，所以"按需"是省钱的前提：
      一场面试正常只触发 3~5 次。
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <span class="k">后端/面试官事件</span>
      <span class="k" id="stats">录制 0 · 已发 0</span>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
const DEFAULT_SECONDS = 20;
const TARGET_W = 640, TARGET_H = 480, BITRATE = 800_000;
const MAX_CHUNK_BYTES = 5 * 1024 * 1024;
const MIME_CANDIDATES = [
  "video/webm;codecs=vp9", "video/webm;codecs=vp8",
  "video/webm", "video/mp4",
];

const $ = s => document.querySelector(s);
const log = s => { const el = $("#log"); el.textContent += s + "\n";
                   el.scrollTop = el.scrollHeight; };

const S = { ws:null, stream:null, mime:"", busy:false, mode:"ondemand",
            t0:0, recorded:0, sent:0 };

function pickMime() {
  for (const m of MIME_CANDIDATES) if (MediaRecorder.isTypeSupported(m)) return m;
  return "";
}

// ---------------- 连接 ----------------
$("#conn").onclick = () => {
  const code = ($("#code").value || "").trim().toUpperCase();
  if (code.length !== 6) { alert("房间号是 6 位"); return; }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  S.ws = new WebSocket(`${proto}://${location.host}/ws/room/${code}?role=candidate&consent=1`);
  S.ws.onopen = () => {
    S.t0 = Date.now();
    $("#wsState").textContent = "已连接";
    $("#wsState").className = "pill on";
    $("#cam").disabled = false;
    log("已连接房间 " + code);
  };
  S.ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "signal") return;          // 候选人侧不看任何信号
    if (m.type === "record_request") {
      log(`⚡ 收到取证请求：录 ${m.seconds || DEFAULT_SECONDS}s（原因：${m.reason || "-"}）`);
      handleRecordRequest(m);
      return;
    }
    log("← " + JSON.stringify(m).slice(0, 160));
  };
  S.ws.onclose = () => {
    $("#wsState").textContent = "已断开";
    $("#wsState").className = "pill";
  };
};

// ---------------- 摄像头 ----------------
$("#cam").onclick = async () => {
  S.mime = pickMime();
  if (!S.mime) { alert("这个浏览器不支持 MediaRecorder"); return; }
  S.stream = await navigator.mediaDevices.getUserMedia({
    video: { width: TARGET_W, height: TARGET_H, facingMode: "user" },
    audio: false,
  });
  $("#cam-view").srcObject = S.stream;
  $("#cam").disabled = true;
  $("#demo").disabled = false;
  $("#meta").textContent = `就绪 · ${S.mime}`;
  log(`摄像头就绪 ${S.mime}`);
};

// ---------------- 一段录制 ----------------
function recordSegment(seconds) {
  return new Promise(resolve => {
    const parts = [];
    const rec = new MediaRecorder(S.stream,
      { mimeType: S.mime, videoBitsPerSecond: BITRATE });
    rec.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
    rec.onstop = () => {
      S.recorded++;
      $("#stats").textContent = `录制 ${S.recorded} · 已发 ${S.sent}`;
      resolve(new Blob(parts, { type: S.mime.split(";")[0] }));
    };

    rec.start();
    $("#meta").textContent = `录制中 ${seconds}s`;
    $("#count").textContent = seconds + "s";
    const started = Date.now();
    const tick = setInterval(() => {
      const left = Math.max(0, seconds * 1000 - (Date.now() - started));
      $("#count").textContent = Math.ceil(left / 1000) + "s";
    }, 200);

    setTimeout(() => {
      clearInterval(tick);
      $("#count").textContent = "--";
      if (rec.state !== "inactive") rec.stop();
    }, seconds * 1000);
  });
}

// ---------------- 发送 ----------------
function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(",", 2)[1]);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

async function sendChunk(blob) {
  const t = Math.round((Date.now() - S.t0) / 100) / 10;
  if (!blob || blob.size < 10240) {
    log(`这段只有 ${blob ? blob.size : 0}B，跳过（接口要求 ≥10240）`);
    return;
  }
  if (blob.size > MAX_CHUNK_BYTES) {
    log(`⚠ ${(blob.size / 1048576).toFixed(1)}MB 超过 5MB，建议降低码率`);
  }
  if (!S.ws || S.ws.readyState !== 1) { log("WS 未连上，本段丢弃"); return; }

  const data = await toBase64(blob);
  S.ws.send(JSON.stringify({
    type: "video_chunk", t, data,
    ct: blob.type || "video/webm",
  }));
  S.sent++;
  $("#stats").textContent = `录制 ${S.recorded} · 已发 ${S.sent}`;
  $("#meta").textContent = `已发送 t=${t}s · ${(blob.size / 1048576).toFixed(2)}MB`;
  log(`→ 发送 t=${t}s ${(blob.size / 1024).toFixed(0)}KB`);
}

// ---------------- 两种模式 ----------------
async function handleRecordRequest(msg) {
  if (S.busy) { log("⚠ 上一段还在录，本次请求忽略"); return; }
  if (!S.stream) { log("⚠ 摄像头未开，无法取证"); return; }
  S.busy = true;
  $("#wsState").className = "pill rec";
  try {
    const seconds = Math.max(15, msg.seconds || DEFAULT_SECONDS);
    const blob = await recordSegment(seconds);
    await sendChunk(blob);
  } finally {
    S.busy = false;
    $("#wsState").className = "pill on";
  }
}

$("#demo").onclick = async () => {
  if (S.mode === "continuous") {
    S.mode = "ondemand";
    $("#demo").textContent = "连续切片模式";
    log("切回按需模式");
    return;
  }
  S.mode = "continuous";
  $("#demo").textContent = "停止连续切片";
  log("⚠ 连续切片模式：每 30 秒上传一次，会持续烧 token，仅供联调");
  while (S.mode === "continuous" && S.stream) {
    const blob = await recordSegment(30);
    await sendChunk(blob);
    await new Promise(r => setTimeout(r, 200));
  }
};
</script>
</body>
</html>
