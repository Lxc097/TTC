name: Commit convention

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: commit-convention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Commit convention
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check title format
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
              event = json.load(event_file)

          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              title = event['pull_request']['title']
          else:
              title = event['head_commit']['message'].partition('\n')[0]

          types = r'(?:feat|fix|docs|refactor|perf|test|style|build|ci|chore|revert)'
          scope = r'(?:\([a-z0-9]+(?:[./-][a-z0-9]+)*\))?'
          description = r'\S(?:[^\t\r\n]*\S)?'
          if not re.fullmatch(rf'{types}{scope}!?: {description}', title):
              raise SystemExit('Use type(scope): description, for example fix(video): restore playback. See CONTRIBUTING.md.')
          PY
